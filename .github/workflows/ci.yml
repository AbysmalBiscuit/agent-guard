name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: shellcheck plugin/scripts/install.sh plugin/hooks/bootstrap-tools

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff format --check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pyrefly check

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor the hooks promise, and the newest release.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python plugin/tests/run.py

  validate:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate plugin
      - run: claude plugin validate .
      - name: Codex and Grok Build manifests and hooks parse as JSON
        run: jq empty .agents/plugins/marketplace.json .grok-plugin/marketplace.json plugin/.codex-plugin/plugin.json plugin/.grok-plugin/plugin.json plugin/hooks/*.json
