# The tool versions the audit runs. Change a version here, then lock it as
# the README says. external.py reads these versions. install.sh installs them.

# Each plugin call to mise trusts this file through MISE_TRUSTED_CONFIG_PATHS,
# so these settings win over the machine's global mise config.
[settings]
github_attestations = true
github.github_attestations = true
aqua.github_attestations = true
lockfile = true
locked_verify_provenance = true

[tools]
"github:fallow-rs/fallow" = "3.34.1"
ast-grep = "0.45.3"
uv = "0.11.26"
"pipx:complexipy" = "8.0.1"
"pipx:lizard" = "1.24.1"
"pipx:vulture" = "2.16"
node = "24.21.0"
"npm:jscpd" = "5.4.2"
"pipx:pyscn" = "1.32.5"
