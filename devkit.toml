#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
worktree_root = "../agent-guard_worktrees/"
baseline_ref = "origin/main"
pr_create_state = "ready"

[tracker]
kind = "github"

[harness]
enforce_writes = true
enforce_commands = true

[tasks.sync]
description = "Install the dev tools from uv.lock"
run = ["uv", "sync", "--locked"]
guard = true

[tasks.lint]
description = "Lint with ruff"
run = ["uv", "run", "ruff", "check"]
guard = true

[tasks.fmt]
description = "Format with ruff"
run = ["uv", "run", "ruff", "format"]
guard = true

[tasks.fmt-check]
description = "Check formatting with ruff"
run = ["uv", "run", "ruff", "format", "--check"]
guard = true

[tasks.typecheck]
description = "Type check with pyrefly"
run = ["uv", "run", "pyrefly", "check"]
guard = true

[tasks.test]
description = "Run the plugin test suite"
run = ["uv", "run", "python", "plugin/tests/run.py"]
guard = true

[tasks.validate]
description = "Validate the Claude Code plugin and marketplace manifests"
steps = [{ task = "validate-plugin" }, { task = "validate-marketplace" }]

[tasks.validate-plugin]
description = "Validate the Claude Code plugin manifest"
run = ["claude", "plugin", "validate", "plugin"]
guard = true

[tasks.validate-marketplace]
description = "Validate the Claude Code marketplace manifest"
run = ["claude", "plugin", "validate", "."]
guard = true

[tasks.verify]
description = "Lint, check formatting and types, test, and validate manifests"
steps = [
    { task = "lint" },
    { task = "fmt-check" },
    { task = "typecheck" },
    { task = "test" },
    { task = "validate-plugin" },
    { task = "validate-marketplace" },
]

[people.lev]
github = "AbysmalBiscuit"

[ticket.fields.github.assignees]
type = "user"
list = true
where = "assignees"
level = "info"

[ticket.fields.github.blocked_by]
type = "issue"
list = true
where = "blocked_by"
level = "info"

[ticket.fields.github.labels]
type = "enum"
list = true
where = "labels"
values = [
  { name = "accessibility", id = "accessibility" },
  { name = "bug", id = "bug" },
  { name = "documentation", id = "documentation" },
  { name = "duplicate", id = "duplicate" },
  { name = "enhancement", id = "enhancement" },
  { name = "good first issue", id = "good first issue" },
  { name = "help wanted", id = "help wanted" },
  { name = "invalid", id = "invalid" },
  { name = "question", id = "question" },
  { name = "wontfix", id = "wontfix" },
  { name = "autorelease: pending", id = "autorelease: pending" },
  { name = "autorelease: tagged", id = "autorelease: tagged" },
]
level = "info"

[ticket.fields.github.parent]
type = "issue"
where = "parent"
level = "info"
